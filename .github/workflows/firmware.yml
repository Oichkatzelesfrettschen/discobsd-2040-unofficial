# The RP2040 kernel, the flash image and the host-only gates. The build
# log is gated on its warnings: the cross build and the kernel emit none,
# and the three usr.bin/ranlib/ranlib.c diagnostics that Ubuntu's gcc adds
# are named one by one, so a fourth warning fails the job.
name: firmware

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
  pull_request:

permissions:
  contents: read

env:
  PICOTOOL_VERSION: '2.3.1'

jobs:
  rp2040:
    name: rp2040 kernel, flash image and gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # bmake drives the tree; share/mk/sys.mk picks byacc over bison on
      # Linux, flex as LEX, mandoc for the manual pages and "vim -es -u
      # NONE" where no ex is installed, and pulls the BSD string and
      # arc4random functions from libbsd-overlay through pkg-config.
      # sys/arch/rp2040/test/swapram's Makefile is written for GNU make,
      # which check-swapram-evac invokes directly, and
      # tools/verify_rp2040_divider_ownership.py needs python3.
      # tools/fsutil/mount.c includes fuse.h and its Makefile asks
      # pkg-config for the fuse flags, so libfuse-dev is a build dependency
      # of the host tools the kernel build runs first.
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake make build-essential cmake git \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            byacc bison flex libbsd-dev libfuse-dev pkg-config mandoc vim \
            python3 libusb-1.0-0-dev

      # Ubuntu 24.04 packages no picotool, and the kernel and flash image
      # rules call "picotool uf2 convert", which arrived in picotool 2.
      # The build is the upstream one: picotool links against the pico-sdk
      # at the matching tag. A default install lands the binary in
      # ${prefix}/bin; PICOTOOL_FLAT_INSTALL moves the whole set under
      # ${prefix}/picotool instead and is left off.
      - name: Cache picotool
        id: picotool-cache
        uses: actions/cache@v4
        with:
          path: ~/picotool-install
          key: picotool-${{ env.PICOTOOL_VERSION }}-ubuntu-24.04
      - name: Build picotool
        if: steps.picotool-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/picotool-src"
          cd "$HOME/picotool-src"
          git clone --depth 1 --branch "$PICOTOOL_VERSION" \
            --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git clone --depth 1 --branch "$PICOTOOL_VERSION" \
            https://github.com/raspberrypi/picotool.git picotool
          cmake -S picotool -B picotool/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$HOME/picotool-src/pico-sdk" \
            -DCMAKE_INSTALL_PREFIX="$HOME/picotool-install"
          cmake --build picotool/build --parallel "$(nproc)"
          cmake --install picotool/build
      - name: Put picotool on PATH
        run: |
          echo "$HOME/picotool-install/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain
        run: |
          cc --version | head -1
          arm-none-eabi-gcc --version | head -1
          bmake -V MACHINE 2>/dev/null || true
          picotool version

      # Each step is a fresh bash -e with no pipefail, so a pipeline into
      # tee would report tee's status and hide a failed bmake. Both build
      # steps set pipefail themselves, and the assertion runs over the
      # whole log once both have appended to it.
      - name: Build the kernel and the userland
        run: |
          set -o pipefail
          bmake MACHINE=rp2040 build 2>&1 | tee build.log

      - name: Build the flash image
        run: |
          set -o pipefail
          bmake MACHINE=rp2040 flash 2>&1 | tee -a build.log

      # Every warning the tree emits is accounted for. The cross build and
      # the kernel emit none. The host tools emit three, all from
      # usr.bin/ranlib/ranlib.c compiled for the host: -Wformat-truncation=
      # on the '%-10ld' directive at lines 419 and 506, and
      # -Wmaybe-uninitialized on 'value' and 'type' at lines 215 and 216.
      # gcc 13.3.0 and gcc 14.2.0, the two compilers Ubuntu 24.04 offers,
      # both emit exactly those three; gcc 16.2.1 emits none, which is why
      # the tree reads as warning-free off this runner. The gate prints
      # every warning, names those three, and fails on a fourth.
      - name: Assert the build is warning-free
        run: |
          # grep -c and grep both exit 1 on no match, which would end the
          # step before the assertion runs, so each count is captured with
          # a fallback.
          known='usr\.bin/ranlib/ranlib\.c:[0-9]+:[0-9]+: warning: .*\[-W(format-truncation=|maybe-uninitialized)\]'
          total=$(grep -c 'warning:' build.log || true)
          rest=$(grep 'warning:' build.log | grep -vE "$known" || true)
          echo "warning: lines in the build log: $total"
          echo "$rest"
          test -z "$rest"
          test "$(grep -cE "$known" build.log || true)" -le 3

      # Host-only gates: the packed a.out container and its loader, the
      # config-generated kernel makefile, the swapram evacuation model
      # compiled natively, and the flash swap link map.
      - name: Run the host gates
        run: |
          bmake MACHINE=rp2040 check-hsaout check-config-makefile \
            check-swapram-evac check-flash-swap

      - name: Confirm the images exist
        run: |
          ls -l sys/arch/rp2040/compile/PICO/unix.uf2 \
                sys/arch/rp2040/compile/PICO_UART/unix.uf2 \
                distrib/rp2040/flash.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: discobsd-rp2040-firmware
          path: |
            sys/arch/rp2040/compile/PICO/unix.uf2
            sys/arch/rp2040/compile/PICO_UART/unix.uf2
            distrib/rp2040/flash.uf2
          if-no-files-found: error
