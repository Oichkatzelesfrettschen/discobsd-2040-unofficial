# The RP2040 kernel, the flash image and the host-only gates. The build
# log is gated on its warnings: the build must emit none.

      - uses: actions/upload-artifact@v4
        with:
          name: discobsd-rp2040-firmware
          path: |
            sys/arch/rp2040/compile/PICO/unix.uf2
            sys/arch/rp2040/compile/PICO_UART/unix.uf2
            distrib/rp2040/flash.uf2
          if-no-files-found: error
