# The RP2040 kernel, the flash image and the test tiers the root Makefile
# groups (sys/arch/rp2040/doc/TESTING.md). The build log is gated on its
# warnings: the build must emit none. The discobsd-host package has its
# own workflow, host.yml, which is the check-host-package tier.
name: firmware

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
  pull_request:

permissions:
  contents: read

env:
  PICOTOOL_VERSION: '2.3.1'

jobs:
  rp2040:
    name: rp2040 kernel, flash image and gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The relocation verifier resolves every origin blob at the pinned
          # pre-migration revision, so a one-commit checkout cannot run it.
          fetch-depth: 0

      - name: Resolve the immutable changed-comment range
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          read -r resolved_base resolved_head < <(
            sh tools/resolve-changed-comment-range.sh . \
              "$EVENT_BASE" "$EVENT_HEAD" \
              "refs/remotes/origin/$DEFAULT_BRANCH"
          )
          test -n "$resolved_base" && test -n "$resolved_head"
          echo "CHANGED_COMMENT_BASE=$resolved_base" >> "$GITHUB_ENV"
          echo "CHANGED_COMMENT_HEAD=$resolved_head" >> "$GITHUB_ENV"

      # bmake drives the tree; share/mk/sys.mk picks byacc over bison on
      # Linux, flex as LEX, mandoc for the manual pages and "vim -es -u
      # NONE" where no ex is installed, and pulls the BSD string and
      # arc4random functions from libbsd-overlay through pkg-config.
      # sys/arch/rp2040/test/swapram's Makefile is written for GNU make,
      # which check-swapram-evac invokes directly.
      # tools/fsutil/mount.c includes fuse.h and its Makefile asks
      # pkg-config for the fuse flags, so libfuse-dev is a build dependency
      # of the host tools the kernel build runs first.
      # The tiers add: shellcheck and ruff (check-lint), qemu-user for
      # qemu-arm (check-qemu), and capstone and pyelftools for the divider
      # verifier (check-cross). ruff comes through pipx: Ubuntu 24.04
      # packages no ruff and pip refuses the system interpreter. The 32-bit
      # shell conformance run is the posix-sh job below.
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake make build-essential cmake git clang \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            byacc bison flex libbsd-dev libfuse-dev pkg-config mandoc vim \
            python3 libusb-1.0-0-dev \
            shellcheck pipx qemu-user python3-capstone python3-pyelftools
          pipx install ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      # Ubuntu 24.04 packages no picotool, and the kernel and flash image
      # rules call "picotool uf2 convert", which arrived in picotool 2.
      # The build is the upstream one: picotool links against the pico-sdk
      # at the matching tag. A default install lands the binary in
      # ${prefix}/bin; PICOTOOL_FLAT_INSTALL moves the whole set under
      # ${prefix}/picotool instead and is left off.
      - name: Cache picotool
        id: picotool-cache
        uses: actions/cache@v4
        with:
          path: ~/picotool-install
          key: picotool-${{ env.PICOTOOL_VERSION }}-ubuntu-24.04
      - name: Build picotool
        if: steps.picotool-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/picotool-src"
          cd "$HOME/picotool-src"
          git clone --depth 1 --branch "$PICOTOOL_VERSION" \
            --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git clone --depth 1 --branch "$PICOTOOL_VERSION" \
            https://github.com/raspberrypi/picotool.git picotool
          cmake -S picotool -B picotool/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$HOME/picotool-src/pico-sdk" \
            -DCMAKE_INSTALL_PREFIX="$HOME/picotool-install"
          cmake --build picotool/build --parallel "$(nproc)"
          cmake --install picotool/build
      - name: Put picotool on PATH
        run: |
          echo "$HOME/picotool-install/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain
        run: |
          cc --version | head -1
          arm-none-eabi-gcc --version | head -1
          qemu-arm --version | head -1
          shellcheck --version | sed -n 2p
          ruff --version
          bmake -V MACHINE 2>/dev/null || true
          picotool version

      # The logged-gate runner streams combined output, writes an atomic
      # status receipt, emits heartbeats during quiet work, and terminates
      # the complete process group at the idle or hard deadline. GitHub's
      # step and job deadlines remain independent outer bounds.
      # tools/online-cpus.sh resolves getconf, BSD sysctl and GNU nproc in
      # that order, then returns one when a host exposes none of them.
      # Measured on a 12-thread host: the kernel alone
      # 8.07 s to 1.55 s, the whole world 136.94 s to 31.10 s. Two -j runs
      # of the world differ from each other in 9 of 3736 artifacts, all of
      # them timestamps -- seven .a archives, whose member mtimes the
      # tree's ar records and cannot suppress, and pdc, which prints
      # __DATE__ and __TIME__; the 1286 library objects those archives
      # wrap are identical, as is every kernel object.
      - name: Build the kernel and the userland
        timeout-minutes: 25
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-build \
            --log .build-logs/linux-build.log \
            --status .build-logs/linux-build.status.json \
            --idle-timeout-seconds 600 --timeout-seconds 1200 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 build

      - name: Build the flash image
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-flash \
            --log .build-logs/linux-flash.log \
            --status .build-logs/linux-flash.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 flash

      # The tree builds warning-free on gcc 13, 14, and 16: the cross build,
      # the kernel, and the host tools. Any warning line fails the job.
      - name: Assert the build is warning-free
        run: |
          # grep exits 1 on no match, which is the wanted outcome here, so
          # the count is captured with a fallback before the assertion.
          total=$(grep -h -c 'warning:' .build-logs/linux-build.log \
            .build-logs/linux-flash.log | awk '{ sum += $1 } END { print sum + 0 }')
          echo "warning: lines in the build log: $total"
          grep -h 'warning:' .build-logs/linux-build.log \
            .build-logs/linux-flash.log || true
          test "$total" -eq 0

      # The UF2 pair the artifact step uploads and discobsd-flash loads.
      - name: Validate the kernel and root UF2 images
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-uf2 \
            --log .build-logs/linux-uf2.log \
            --status .build-logs/linux-uf2.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-uf2-images

      # The tiers, each a root Makefile target: lint (shellcheck at error
      # severity, ruff), host (libc, utility and kernel-model gates plus every
      # maintained program with a host build and a suite),
      # the 32-bit shell conformance run, cross (the linked kernels, the
      # board libc, the packed images, the assembler), qemu (the u-area
      # exchange loop and the Smaller C suite executed), and the board
      # regression programs built to a.out.
      - name: Run the lint tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-lint \
            --log .build-logs/linux-lint.log \
            --status .build-logs/linux-lint.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-lint

      - name: Check comments changed by the tested revision
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-changed-comments \
            --log .build-logs/linux-changed-comments.log \
            --status .build-logs/linux-changed-comments.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 \
              CHANGED_COMMENT_BASE="$CHANGED_COMMENT_BASE" \
              CHANGED_COMMENT_HEAD="$CHANGED_COMMENT_HEAD" \
              check-changed-comments

      - name: Run the host tier
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-host \
            --log .build-logs/linux-host.log \
            --status .build-logs/linux-host.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 720 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-host

      - name: Run the cross tier
        timeout-minutes: 20
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-cross \
            --log .build-logs/linux-cross.log \
            --status .build-logs/linux-cross.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 900 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-cross

      - name: Run the qemu tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-qemu \
            --log .build-logs/linux-qemu.log \
            --status .build-logs/linux-qemu.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-qemu

      - name: Run the board-build tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-board-build \
            --log .build-logs/linux-board-build.log \
            --status .build-logs/linux-board-build.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-board-build

      - name: Confirm the images exist
        run: |
          ls -l sys/arch/rp2040/compile/PICO/unix.uf2 \
                sys/arch/rp2040/compile/PICO_UART/unix.uf2 \
                distrib/rp2040/flash.uf2

      - name: Retain build and gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: discobsd-rp2040-firmware
          path: |
            sys/arch/rp2040/compile/PICO/unix.uf2
            sys/arch/rp2040/compile/PICO_UART/unix.uf2
            distrib/rp2040/flash.uf2
          if-no-files-found: error

  # Every required ILP32 variant belongs to this provisioned job. Executable
  # receipts distinguish assertion results from optional local skips.
  posix-sh:
    name: Required ILP32 execution (shell, kernel, libc and utilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install bmake and the 32-bit compiler support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake build-essential gcc-multilib python3 pkg-config libbsd-dev
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Calibrate execution accounting
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label posix-inventory \
            --log .build-logs/posix-inventory.log \
            --status .build-logs/posix-inventory.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-test-execution
      - name: Execute every required variant
        timeout-minutes: 12
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label posix-ilp32 \
            --log .build-logs/posix-ilp32.log \
            --status .build-logs/posix-ilp32.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake MACHINE=rp2040 check-ilp32-execution \
              TEST_EXECUTION_REPORT="$RUNNER_TEMP/ilp32-execution.json"
      - name: Retain ILP32 gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilp32-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Retain per-variant invocations and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilp32-execution
          path: ${{ runner.temp }}/ilp32-execution.json
          if-no-files-found: error

  # The same tree on macOS, with Homebrew's host tools and a checksum-pinned
  # Arm GNU package. The arm-none-eabi-gcc formula is built with an absolute
  # --with-as and ignores the -B that substitutes the port's a.out assembler;
  # the rolling gcc-arm-embedded cask follows a mutable vendor package URL.
  # No FUSE: fsutil builds without its --mount command. The gate is the same
  # warning-free kernel, world and flash image.
  rp2040-macos:
    name: rp2040 kernel, flash image on macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # check-host includes the relocation verifier and needs the pinned
          # pre-migration source revision on macOS too.
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          brew install bmake byacc bison flex groff mandoc pkgconf picotool \
            shellcheck ruff coreutils cpio
          case "$(uname -m)" in
            arm64)
              arm_toolchain_version=15.3.rel1
              arm_toolchain_arch=arm64
              arm_toolchain_sha256=5fb58dc3bd6684e70a02bd1c654a6b91f044cda241eb3ae663a7b9170491d7b2
              ;;
            x86_64)
              arm_toolchain_version=14.2.rel1
              arm_toolchain_arch=x86_64
              arm_toolchain_sha256=5d2e9ee4e73350bda79accc69fcd5ee59ccb902804a3f81a01d4c543b1ad7de7
              ;;
            *)
              echo "unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          arm_toolchain_package="$RUNNER_TEMP/arm-gnu-toolchain.pkg"
          arm_toolchain_url="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/$arm_toolchain_version/arm-gnu-toolchain-$arm_toolchain_version-darwin-$arm_toolchain_arch-arm-none-eabi.pkg"
          curl --fail --location --retry 3 --output "$arm_toolchain_package" \
            "$arm_toolchain_url"
          printf '%s  %s\n' "$arm_toolchain_sha256" "$arm_toolchain_package" \
            | shasum -a 256 --check
          sudo installer -pkg "$arm_toolchain_package" -target /
          echo "/Applications/ArmGNUToolchain/$arm_toolchain_version/arm-none-eabi/bin" \
            >> "$GITHUB_PATH"
          # The divider verifier reads the kernels through capstone and
          # pyelftools; Homebrew's Python refuses pip installs into itself,
          # so they live in a venv the tiers name as PYTHON.
          python3 -m venv "$HOME/gates-venv"
          "$HOME/gates-venv/bin/pip" install --quiet capstone pyelftools
          echo "PYTHON=$HOME/gates-venv/bin/python3" >> "$GITHUB_ENV"
      - name: Report the toolchain
        run: |
          cc --version | head -1
          arm-none-eabi-gcc --version | head -1
          bmake -V MAKE_VERSION
          picotool version
      # tools/online-cpus.sh resolves getconf, BSD sysctl and GNU nproc in
      # that order, then returns one when a host exposes none of them.
      # Measured on a 12-thread host: the kernel alone
      # 8.07 s to 1.55 s, the whole world 136.94 s to 31.10 s. Two -j runs
      # of the world differ from each other in 9 of 3736 artifacts, all of
      # them timestamps -- seven .a archives, whose member mtimes the
      # tree's ar records and cannot suppress, and pdc, which prints
      # __DATE__ and __TIME__; the 1286 library objects those archives
      # wrap are identical, as is every kernel object.
      - name: Build the kernel and the userland
        timeout-minutes: 35
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-build \
            --log .build-logs/macos-build.log \
            --status .build-logs/macos-build.status.json \
            --idle-timeout-seconds 600 --timeout-seconds 1800 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 build
      - name: Build the flash image
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-flash \
            --log .build-logs/macos-flash.log \
            --status .build-logs/macos-flash.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 flash
      - name: Assert the build is warning-free
        run: |
          total=$(grep -h -c 'warning:' .build-logs/macos-build.log \
            .build-logs/macos-flash.log | awk '{ sum += $1 } END { print sum + 0 }')
          echo "warning: lines in the build log: $total"
          grep -h 'warning:' .build-logs/macos-build.log \
            .build-logs/macos-flash.log || true
          test "$total" -eq 0
      - name: Validate the kernel and root UF2 images
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-uf2 \
            --log .build-logs/macos-uf2.log \
            --status .build-logs/macos-uf2.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-uf2-images
      # coreutils gives the textbox suite its GNU references and cpio the
      # GNU cpio the cpio suite drives; macOS ships uuencode itself.
      # The tiers macOS can run. Left out: check-posix-sh (a 32-bit
      # Linux binary) and check-qemu (Homebrew's qemu has no user-mode
      # emulation).
      # The Smaller C suite runs link-only here and says so.
      - name: Run the lint tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-lint \
            --log .build-logs/macos-lint.log \
            --status .build-logs/macos-lint.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-lint
      - name: Run the host tier
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-host \
            --log .build-logs/macos-host.log \
            --status .build-logs/macos-host.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 720 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-host
      - name: Run the cross tier
        timeout-minutes: 20
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-cross \
            --log .build-logs/macos-cross.log \
            --status .build-logs/macos-cross.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 900 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-cross
      - name: Run the board-build tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-board-build \
            --log .build-logs/macos-board-build.log \
            --status .build-logs/macos-board-build.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-board-build
      - name: Link the Smaller C suite
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-smaller-c \
            --log .build-logs/macos-smaller-c.log \
            --status .build-logs/macos-smaller-c.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake -C usr.bin/smlrc test
      - name: Confirm the images exist
        run: |
          ls -l sys/arch/rp2040/compile/PICO/unix.uf2 distrib/rp2040/flash.uf2
      - name: Retain build and gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-macos-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  # The flash-id probe in tools/flash-id is the one artifact here built
  # against the Pico SDK rather than the tree's own bmake, and it ships in
  # no image, so this job is the only place the SDK route is exercised. It
  # fetches the SDK at the commit tools/pico-sdk/fetch-pico-sdk.sh pins and
  # asserts the probe still links and still fits SRAM. Everything it needs
  # is in this repository, so the job needs no second checkout and no
  # secret, and it runs on a pull request from a fork.
  flash-id:
    name: flash-id against the Pico SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The kernel builds -nostdinc against the tree's own libc, so the
      # rp2040 job needs no target C library. This one does: the SDK links
      # newlib and the target libstdc++, which the flash_id.elf map shows
      # as libc.a, libg.a, libm.a and libstdc++.a under thumb/v6-m/nofp.
      # Debian and Ubuntu ship those apart from the compiler and
      # gcc-arm-none-eabi does not depend on them, so naming the compiler
      # alone leaves the link without a C library.
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake cmake ninja-build git \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Fetch the Pico SDK at the pinned commit
        run: sh tools/pico-sdk/fetch-pico-sdk.sh
      - name: Report the toolchain
        run: |
          cmake --version | head -1
          ninja --version
          arm-none-eabi-gcc --version | head -1
          sh tools/pico-sdk/sdk-path.sh
      - name: Build flash-id and check it fits SRAM
        timeout-minutes: 12
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label sdk-flash-id \
            --log .build-logs/sdk-flash-id.log \
            --status .build-logs/sdk-flash-id.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake MACHINE=rp2040 check-flash-id
      - name: Retain flash-id build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-id-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn
