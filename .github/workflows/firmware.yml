# The RP2040 kernel, the flash image and the test tiers the root Makefile
# groups (sys/arch/rp2040/doc/TESTING.md). The build log is gated on its
# warnings: the build must emit none. The gizmobsd-host package has its
# own workflow, host.yml, which is the check-host-package tier.
#
# A push to main runs the rp2040 job's fixed short set: the warning-free
# build, the kernel headroom, the flash image, the UF2 validation, the lint
# tier, the changed-comment and changed-text checks and the Renode UART0
# boot. A pull request runs the part of that set that takes seconds: the
# toolchain install, the lint tier and the changed-comment and changed-text
# checks; the build, the headroom, the flash image, the UF2 validation, the
# panel program replay and the Renode boot wait for the merge to main, and
# the local gates over the changed files carry what the pull request
# changes. The job keeps one name on every event because branch protection
# requires that name. The nightly run, on main, and a manual dispatch, on
# the ref it names, add every other tier and every other job (FULL_GATES);
# a nightly that fails opens or updates one issue (the nightly-report job).
name: firmware

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# A run that enters the group of its pull request or pushed branch cancels
# the run in progress there, so a burst of merges to main leaves one
# finished run. GitHub orders a group by arrival and does not promise push
# order, so that run is usually the last merge's and its head SHA says
# which; a failure there names the burst, and rerunning the cancelled run of
# one merge isolates it. Scheduled and dispatched runs each take their own
# group and finish.
concurrency:
  group: firmware-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  PICOTOOL_VERSION: '2.3.1'
  # The Renode release the two Renode gates were verified against. The
  # archive is the dotnet build with an /opt/renode/bin layout, the one
  # tools/renode/fetch-renode-rp2040.sh builds the peripheral models
  # against (RenodePath in the models' Peripherals.csproj). The digest is
  # the SHA-256 the release page publishes for that archive.
  RENODE_VERSION: '1.17.0'
  RENODE_SHA256: 'd64cffde48e72064ba9e87ff34e186cb7aa8d8f296dec9bbbcd6a8b76ae7fd76'
  # 'true' on the nightly schedule and on a manual dispatch, the two events
  # that run every tier. A step outside the short set carries
  # "if: env.FULL_GATES == 'true'"; a job outside it repeats the event test,
  # since a job-level condition cannot read env.
  FULL_GATES: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  rp2040:
    name: rp2040 kernel, flash image and gates
    runs-on: ubuntu-24.04
    # A full run on main measured about 65 minutes; the asynchronous system
    # trap tier adds 10.1. Hosted runners vary by about 25 percent between
    # runs (the same steps took 899 and 1,098 seconds in the host tier), so
    # the limit covers a slow runner's 94 minutes with margin, plus the
    # qemu tier's C17 math family, which adds up to 25 more. On 2026-11-21 the
    # host tier alone took 36 minutes (run 44844712110) and every later tier
    # took 85 minutes in a run that skipped the host tier (44849576870, its SD
    # system tier ended by the idle timeout after 13 of up to 24 minutes), so a
    # passing run needs about 130 minutes or more. The first fully passing run,
    # dispatch 44895879561, took 148 minutes (host tier 2,490 s, asynchronous
    # system trap tier 690 s, SD system tier 1,083 s). Two runs of one workload
    # differed by at least 13 percent (macOS first host part, 2,594 s and more
    # than 2,935 s), and the host tier grows with the i86 mutant lists, so the
    # bound is 210.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          # The relocation verifier resolves every origin blob at the pinned
          # pre-migration revision, so a one-commit checkout cannot run it.
          fetch-depth: 0

      - name: Resolve the immutable changed-comment range
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # A scheduled or dispatched run carries no event base; the head's
        # first parent, the prior tip of main, gives the last merge's range.
        run: |
          if [ -z "$EVENT_BASE" ]; then
            EVENT_BASE=$(git rev-parse "$EVENT_HEAD^")
          fi
          read -r resolved_base resolved_head < <(
            sh tools/resolve-changed-comment-range.sh . \
              "$EVENT_BASE" "$EVENT_HEAD" \
              "refs/remotes/origin/$DEFAULT_BRANCH"
          )
          test -n "$resolved_base" && test -n "$resolved_head"
          echo "CHANGED_COMMENT_BASE=$resolved_base" >> "$GITHUB_ENV"
          echo "CHANGED_COMMENT_HEAD=$resolved_head" >> "$GITHUB_ENV"

      # bmake drives the tree; share/mk/sys.mk picks byacc over bison on
      # Linux, flex as LEX, mandoc for the manual pages and "vim -es -u
      # NONE" where no ex is installed, and pulls the BSD string and
      # arc4random functions from libbsd-overlay through pkg-config.
      # sys/arch/rp2040/test/swapram's Makefile is written for GNU make,
      # which check-swapram-evac invokes directly.
      # tools/fsutil/mount.c includes fuse.h and its Makefile asks
      # pkg-config for the fuse flags, so libfuse-dev is a build dependency
      # of the host tools the kernel build runs first.
      # The tiers add: shellcheck and ruff (check-lint), qemu-user for
      # qemu-arm and libnewlib-arm-none-eabi for the C library the qemu-arm
      # test programs link (check-qemu: libcalc, libbn, calc, dc), which
      # gcc-arm-none-eabi does not depend on, and capstone and pyelftools
      # for the divider verifier (check-cross). ruff comes through pipx: Ubuntu 24.04
      # packages no ruff and pip refuses the system interpreter. gcc-multilib
      # gives check-storage-correctness the -m32 build its wall clock cases
      # need. The 32-bit shell conformance run is the posix-sh job below.
      # cffi, hypothesis and pytest run check-swap-tier-model in the host
      # tier, which prints a SKIP without them.
      - name: Select the apt cache week
        id: apt-week-rp2040
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives/*.deb
          key: apt-rp2040-${{ steps.apt-week-rp2040.outputs.week }}-${{ hashFiles('.github/workflows/firmware.yml') }}
          restore-keys: |
            apt-rp2040-
      - name: Install the host toolchain
        timeout-minutes: 20
        run: |
          CI_APT_ARCHIVES="$HOME/apt-archives" sh tools/ci_apt_install.sh \
            bmake make build-essential cmake git clang cflow cscope ripgrep jq \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            byacc bison flex libbsd-dev libfuse-dev pkg-config mandoc vim \
            python3 python3-pil libusb-1.0-0-dev \
            shellcheck pipx qemu-user python3-capstone python3-pyelftools \
            python3-unicorn gcc-multilib strace \
            python3-cffi python3-hypothesis python3-pytest
          pipx install ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      # Ubuntu 24.04 packages no picotool, and the kernel and flash image
      # rules call "picotool uf2 convert", which arrived in picotool 2.
      # The build is the upstream one: picotool links against the pico-sdk
      # at the matching tag. A default install lands the binary in
      # ${prefix}/bin; PICOTOOL_FLAT_INSTALL moves the whole set under
      # ${prefix}/picotool instead and is left off.
      - name: Cache picotool
        if: github.event_name != 'pull_request'
        id: picotool-cache
        uses: actions/cache@v4
        with:
          path: ~/picotool-install
          key: picotool-${{ env.PICOTOOL_VERSION }}-ubuntu-24.04
      - name: Build picotool
        if: github.event_name != 'pull_request' && steps.picotool-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/picotool-src"
          cd "$HOME/picotool-src"
          git clone --depth 1 --branch "$PICOTOOL_VERSION" \
            --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git clone --depth 1 --branch "$PICOTOOL_VERSION" \
            https://github.com/raspberrypi/picotool.git picotool
          cmake -S picotool -B picotool/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$HOME/picotool-src/pico-sdk" \
            -DCMAKE_INSTALL_PREFIX="$HOME/picotool-install"
          cmake --build picotool/build --parallel "$(nproc)"
          cmake --install picotool/build
      - name: Put picotool on PATH
        if: github.event_name != 'pull_request'
        run: |
          echo "$HOME/picotool-install/bin" >> "$GITHUB_PATH"
      - name: Report the toolchain
        run: |
          cc --version | head -1
          arm-none-eabi-gcc --version | head -1
          qemu-arm --version | head -1
          shellcheck --version | sed -n 2p
          ruff --version
          bmake -V MACHINE 2>/dev/null || true
          # A pull request installs no picotool: its steps need none.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            picotool version
          fi

      # The logged-gate runner streams combined output, writes an atomic
      # status receipt, emits heartbeats during quiet work, and terminates
      # the complete process group at the idle or hard deadline. GitHub's
      # step and job deadlines remain independent outer bounds.
      # tools/online-cpus.sh resolves getconf, BSD sysctl and GNU nproc in
      # that order, then returns one when a host exposes none of them; on
      # Linux it bounds the count by affinity and the cgroup CPU quota.
      # Measured on a 12-thread host: the kernel alone
      # 8.07 s to 1.55 s, the whole world 136.94 s to 31.10 s. Two -j runs
      # of the world differ from each other in 9 of 3736 artifacts, all of
      # them timestamps -- seven .a archives, whose member mtimes the
      # tree's ar records and cannot suppress, and pdc, which prints
      # __DATE__ and __TIME__; the 1286 library objects those archives
      # wrap are identical, as is every kernel object.
      - name: Build the kernel and the userland
        if: github.event_name != 'pull_request'
        timeout-minutes: 25
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-build \
            --log .build-logs/linux-build.log \
            --status .build-logs/linux-build.status.json \
            --idle-timeout-seconds 600 --timeout-seconds 1200 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 build

      # The linker refuses a kernel that overflows FLASH. This gate reports a
      # kernel that links but has less than the margin of tools/
      # check_kernel_headroom.py left, under the toolchain this job installs.
      - name: Check the kernel flash headroom, dump-writer linkage and buffer alignment
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-kernel-headroom \
            --log .build-logs/linux-kernel-headroom.log \
            --status .build-logs/linux-kernel-headroom.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-kernel-headroom \
            check-dump-writer-link check-kernel-buffer-alignment

      - name: Verify MPU startup and reported permissions in the linked kernels
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-mpu-startup \
            --log .build-logs/linux-mpu-startup.log \
            --status .build-logs/linux-mpu-startup.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-mpu-startup

      - name: Replay the full PicoCalc panel register programs
        if: github.event_name != 'pull_request'
        timeout-minutes: 2
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-panel-programs \
            --log .build-logs/linux-panel-programs.log \
            --status .build-logs/linux-panel-programs.status.json \
            --idle-timeout-seconds 60 --timeout-seconds 90 \
            -- bmake MACHINE=rp2040 check-panel-programs

      - name: Build the flash image
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-flash \
            --log .build-logs/linux-flash.log \
            --status .build-logs/linux-flash.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 flash

      # The tree builds warning-free on gcc 13, 14, and 16: the cross build,
      # the kernel, and the host tools. Any warning line fails the job.
      - name: Assert the build is warning-free
        if: github.event_name != 'pull_request'
        run: |
          # grep exits 1 on no match, which is the wanted outcome here, so
          # the count is captured with a fallback before the assertion.
          total=$(grep -h -c 'warning:' .build-logs/linux-build.log \
            .build-logs/linux-flash.log | awk '{ sum += $1 } END { print sum + 0 }')
          echo "warning: lines in the build log: $total"
          grep -h 'warning:' .build-logs/linux-build.log \
            .build-logs/linux-flash.log || true
          test "$total" -eq 0

      # The UF2 pair the artifact step uploads and gizmobsd-flash loads.
      - name: Validate the kernel and root UF2 images
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-uf2 \
            --log .build-logs/linux-uf2.log \
            --status .build-logs/linux-uf2.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-uf2-images

      # The cross tier checks compiler-object attribution and linked table pointers;
      # the qemu tier checks executable-format dispatch with recording stubs.
      # The tiers, each a root Makefile target: lint (shellcheck at error
      # severity, ruff), host (libc, utility and kernel-model gates plus every
      # maintained program with a host build and a suite),
      # the 32-bit shell conformance run, cross (the linked kernels, the
      # board libc, the packed images, the assembler), qemu (the u-area
      # exchange loop and the Smaller C suite executed), and the board
      # regression programs built to a.out.
      - name: Run the lint tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-lint \
            --log .build-logs/linux-lint.log \
            --status .build-logs/linux-lint.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-lint

      - name: Check comments changed by the tested revision
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-changed-comments \
            --log .build-logs/linux-changed-comments.log \
            --status .build-logs/linux-changed-comments.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 \
              CHANGED_COMMENT_BASE="$CHANGED_COMMENT_BASE" \
              CHANGED_COMMENT_HEAD="$CHANGED_COMMENT_HEAD" \
              check-changed-comments

      - name: Check text added by the tested revision
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-changed-text \
            --log .build-logs/linux-changed-text.log \
            --status .build-logs/linux-changed-text.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 \
              CHANGED_COMMENT_BASE="$CHANGED_COMMENT_BASE" \
              CHANGED_COMMENT_HEAD="$CHANGED_COMMENT_HEAD" \
              check-changed-text

      # check-host owns compiler-matrix identity, ownership and bounded PTY completion.
      # check-native-nm covers archive boundaries and calibrated reader failures.
      # check-signal-sets owns scalar set behavior and calibrated provider failures.
      # It also checks the fixed Git-tree repository coverage ledger and rejection fixtures.
      # Libc strings and exit registries execute calibrated host and ILP32 cases;
      # Callable character I/O adds header, native/ILP32/sanitizer and QEMU
      # witnesses; native archive controls require its four provider members.
      # Strings, byte searches, context sorting and absolute values add sanitizers; the libc
      # QEMU tier replays strings, quick exit, context sorting and absolute values
      # as Thumb-1. Native archive omission controls cover callable abs/labs.
      # Callable div/ldiv/lldiv/llabs run native, ILP32, sanitized and as Thumb-1.
      # The C17 locale, strtof, time, math and wide families run the same way; time
      # has no Thumb-1 variant and math holds Thumb-1 to glibc-checked digests.
      # This job installs cffi, hypothesis and pytest, so the swap tier
      # model gate fails rather than skips when one is missing.
      # The tier is bound by total CPU work on a four-CPU runner, not by the
      # order of its gates; sys/arch/rp2040/doc/TESTING.md (check-host-split)
      # holds the measured wall times. The tier took 3,163 s in scheduled run
      # 45006931968 and reached a 3,600 s limit inside the i86 mutant run in
      # dispatch 45080339746, so the hard timeout is 5,400 s; the idle timeout
      # still ends a hung gate.
      # bmake -k keeps starting every gate that does not depend on the failed
      # one, so one run lists each failing gate with its own cause; the step
      # still exits 1 when any gate fails. Without -k the first failure stops
      # the gates still queued, and each further defect costs another run.
      - name: Run the host tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 92
        env:
          SWAP_TIER_MODEL_REQUIRED: "1"
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-host \
            --log .build-logs/linux-host.log \
            --status .build-logs/linux-host.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 5400 \
            -- bmake -k -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-host

      # check-signal-sets-cross owns target signatures and Smaller C input;
      # check-signal-sets-qemu owns real-header Cortex-M0 set execution.
      # check-public-time-types owns standalone/reordered time and signal
      # types, both cross time views, native-input policy and linker aliases.
      # check-fd-set-cross checks standalone macros and Smaller C input;
      # check-fd-set-host/qemu check initialized sets and getty I/O ownership.
      # check-cross owns the string namespace/signature and expanded Smaller C
      # header gate on both host platforms; runtime behavior stays separate.
      # It also owns root-header inclusion and curses integer ABI calibration.
      # It also calibrates explicit shared-libc API/provider closure with ARM
      # object archives through check-libc-shared-closure on both platforms.
      # check-cross-assembler owns divider-window and ELF alias-extent controls.
      # check-libc-declaration-census inventories root-header exposure and
      # linker-name providers across feature modes and both time widths.
      # check-libc-pic-replay calibrates captured compiler replay and source,
      # tool, archive, standard-input and output ownership before PIC sizing.
      - name: Run the cross tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 20
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-cross \
            --log .build-logs/linux-cross.log \
            --status .build-logs/linux-cross.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 900 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-cross

      - name: Enumerate V7 transfer prefixes at a one-block parent
        if: env.FULL_GATES == 'true'
        timeout-minutes: 10
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-storage-prefix \
            --log .build-logs/linux-storage-prefix.log \
            --status .build-logs/linux-storage-prefix.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 540 \
            -- bmake MACHINE=rp2040 STORAGE_PREFIX_PARENT_BLOCKS=1 \
              check-storage-recovery-prefix

      # The linked kernel's core 0 and core 1 code on two emulated cores,
      # then seventeen kernels rebuilt from mutated source that must fail;
      # python3-unicorn above is its one dependency beyond the cross tier.
      - name: Run the core 1 emulation tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-core1-emulation \
            --log .build-logs/linux-core1-emulation.log \
            --status .build-logs/linux-core1-emulation.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-core1-emulation

      # The swap-codec cycle model (docs/research/picocalc-device-first) runs
      # its self-test: aliased output, drifted zero-fill, incomplete compile
      # command, mismatched binutils, failed round trip and a perturbed
      # golden file must each fail; python3-unicorn and python3-capstone above
      # are its dependencies beyond the cross tier.
      - name: Run the cycle-model harness self-test
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-cycle-model \
            --log .build-logs/linux-cycle-model.log \
            --status .build-logs/linux-cycle-model.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-picocalc-cycle-model

      - name: Run the qemu tier
        if: env.FULL_GATES == 'true'
        # Includes the executable-tail libc object ABI experiment with real
        # ELF/a.out conversion and calibrated QEMU identity checks, plus
        # native-call veneers and shared ROM dispatch under Unicorn with
        # ARMv6-M encoding and malformed-descriptor controls. Byte-search
        # instruction work has separate scalar, state and budget controls.
        # Callable slots also check canonical pointers, exact ELF extents,
        # LTO, weak aliases and callbacks from a separately linked SRAM image.
        # The C17 math family runs 5.2 million checks and 36 mutants under
        # qemu-user and prints nothing while a program runs, so the tier
        # takes more than nine minutes locally with silences of minutes.
        timeout-minutes: 32
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-qemu \
            --log .build-logs/linux-qemu.log \
            --status .build-logs/linux-qemu.status.json \
            --idle-timeout-seconds 900 --timeout-seconds 1800 \
            -- bmake MACHINE=rp2040 check-qemu

      - name: Run the board-build tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-board-build \
            --log .build-logs/linux-board-build.log \
            --status .build-logs/linux-board-build.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-board-build

      - name: Run the PicoCalc SD panel primitives under Unicorn
        if: env.FULL_GATES == 'true'
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-panel-gfx-ext \
            --log .build-logs/linux-panel-gfx-ext.log \
            --status .build-logs/linux-panel-gfx-ext.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-panel-gfx-ext

      # The Renode tiers reuse the PICO_UART and PICOCALC kernels and the
      # flash image built above. Renode needs a dotnet runtime and the
      # fetched peripheral models are a dotnet build, so setup-dotnet
      # provides the 8.0 SDK for the net8.0 target the fetch script retargets
      # the models to, the framework Renode.runtimeconfig.json names; models
      # built for a newer framework fail to load when Renode runs on 8.0. The
      # Renode archive is unpacked under /opt/renode
      # because Peripherals.csproj references /opt/renode/bin; the launcher
      # resolves bin/ beside itself, so the directory goes on PATH rather
      # than a symlink to the launcher.
      - uses: actions/setup-dotnet@v4
        if: github.event_name != 'pull_request'
        with:
          dotnet-version: '8.0.x'
      - name: Install the pinned Renode release
        if: github.event_name != 'pull_request'
        run: |
          archive="$RUNNER_TEMP/renode-$RENODE_VERSION.linux.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/renode/renode/releases/download/v$RENODE_VERSION/renode-$RENODE_VERSION.linux.tar.gz"
          printf '%s  %s\n' "$RENODE_SHA256" "$archive" | sha256sum --check
          sudo mkdir -p /opt/renode
          sudo tar -xzf "$archive" --strip-components=1 -C /opt/renode
          echo /opt/renode >> "$GITHUB_PATH"
      # VERIFIED_RENODE in the two gate scripts names the build the gates
      # were last checked against and only notes a mismatch; here a
      # different build fails the job, so the pinned release and the
      # recorded build cannot drift apart.
      - name: Confirm the Renode build the gates were verified against
        if: github.event_name != 'pull_request'
        run: sh tools/renode/check-renode-pin.sh
      - name: Check file-backed SD against production SPI protocol
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-matezinho-sd \
            --log .build-logs/linux-matezinho-sd.log \
            --status .build-logs/linux-matezinho-sd.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 540 \
            -- bmake MACHINE=rp2040 check-matezinho-sd
      # The fetch script requires the register description archive's
      # SHA-256 whether it comes from this cache or from the vendor's
      # server, and the script's own text is the key, so a moved pin misses
      # the cache and downloads the new file.
      - name: Cache the RP2040 register description archive
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: tools/renode/vendor/RP2040.svd.gz
          key: renode-rp2040-svd-${{ hashFiles('tools/renode/fetch-renode-rp2040.sh') }}
      - name: Fetch and build the Renode RP2040 models
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        run: sh tools/renode/fetch-renode-rp2040.sh
      - name: Run the Renode UART0 boot tier
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode \
            --log .build-logs/linux-renode.log \
            --status .build-logs/linux-renode.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-renode
      - name: Run the Renode table exhaustion tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-capacity \
            --log .build-logs/linux-renode-capacity.log \
            --status .build-logs/linux-renode-capacity.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-renode-capacity
      - name: Run the Renode asynchronous system trap tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 22
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-preempt \
            --log .build-logs/linux-renode-preempt.log \
            --status .build-logs/linux-renode-preempt.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 1200 \
            -- bmake MACHINE=rp2040 check-renode-preempt
      - name: Run the Renode image identity tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-identity \
            --log .build-logs/linux-renode-identity.log \
            --status .build-logs/linux-renode-identity.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-renode-identity
      - name: Run the Renode PicoCalc tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-picocalc \
            --log .build-logs/linux-renode-picocalc.log \
            --status .build-logs/linux-renode-picocalc.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-renode-picocalc
      - name: Boot the expanded PicoCalc SD system
        if: env.FULL_GATES == 'true'
        timeout-minutes: 32
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-picocalc-sd-system \
            --log .build-logs/linux-renode-picocalc-sd-system.log \
            --status .build-logs/linux-renode-picocalc-sd-system.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 1800 \
            -- bmake MACHINE=rp2040 check-renode-picocalc-sd-system

      # savecore ships in the picocalc profile, so the crash-dump tier boots
      # the PICOCALC board's root image.
      - name: Build the PicoCalc flash image
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-flash-picocalc \
            --log .build-logs/linux-flash-picocalc.log \
            --status .build-logs/linux-flash-picocalc.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 \
            BOARD=PICOCALC flash
      - name: Run the Renode PicoCalc crash-dump tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 25
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-picocalc-dump \
            --log .build-logs/linux-renode-picocalc-dump.log \
            --status .build-logs/linux-renode-picocalc-dump.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 1440 \
            -- bmake MACHINE=rp2040 check-renode-picocalc-dump
      - name: Run the Renode union kernel tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-union \
            --log .build-logs/linux-renode-union.log \
            --status .build-logs/linux-renode-union.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-renode-union
      # The full PicoCalc kernel serves kern.capacity; PICOCALC_LEAN omits
      # CAPACITY_STATS, so its tier asserts the refusal.
      - name: Run the Renode lean union kernel tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-union-lean \
            --log .build-logs/linux-renode-union-lean.log \
            --status .build-logs/linux-renode-union-lean.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-renode-union-lean
      # PICOCALC_LEAN_DIAG adds SYSTRACE and CAPACITY_STATS to the lean
      # kernel and serves the kern.capacity record again.
      - name: Run the Renode diagnostic lean union kernel tier
        if: env.FULL_GATES == 'true'
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-renode-union-diag \
            --log .build-logs/linux-renode-union-diag.log \
            --status .build-logs/linux-renode-union-diag.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake MACHINE=rp2040 check-renode-union-diag
      - name: Retain the Renode logs and transcripts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: renode-results
          path: tools/renode/vendor/results/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Confirm the images exist
        if: github.event_name != 'pull_request'
        run: |
          ls -l sys/arch/rp2040/compile/PICO/unix.uf2 \
                sys/arch/rp2040/compile/PICO_DIAG/unix.uf2 \
                sys/arch/rp2040/compile/PICO_UART/unix.uf2 \
                sys/arch/rp2040/compile/PICOCALC/unix.uf2 \
                sys/arch/rp2040/compile/PICOCALC_LEAN/unix.uf2 \
                sys/arch/rp2040/compile/PICOCALC_LEAN_DIAG/unix.uf2 \
                distrib/rp2040/flash.uf2

      - name: Retain build and gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: discobsd-rp2040-firmware
          path: |
            sys/arch/rp2040/compile/PICO/unix.uf2
            sys/arch/rp2040/compile/PICO_DIAG/unix.uf2
            sys/arch/rp2040/compile/PICO_UART/unix.uf2
            sys/arch/rp2040/compile/PICOCALC/unix.uf2
            sys/arch/rp2040/compile/PICOCALC_LEAN/unix.uf2
            sys/arch/rp2040/compile/PICOCALC_LEAN_DIAG/unix.uf2
            distrib/rp2040/flash.uf2
          if-no-files-found: error

      # cleanall destroys the images and logs retained above, so the
      # residue check runs last: every file the build and the gates wrote
      # must be removed by a clean target or named in
      # tools/clean-residue-allow.txt.
      - name: Check that cleanall leaves no residue
        if: env.FULL_GATES == 'true'
        timeout-minutes: 10
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-clean-residue \
            --log .build-logs/linux-clean-residue.log \
            --status .build-logs/linux-clean-residue.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 540 \
            -- bmake MACHINE=rp2040 check-clean-residue

  # The STM32 tree: the ten Cortex-M4 kernels, the userland and the tools,
  # all through the machine registry's stm32 tuple. No gate runs these
  # binaries; the job establishes that they compile and link, which is the
  # evidence class that would have caught the unresolved __aeabi_ldivmod
  # in the kernel link. Userland compiles with -Wall -Wextra -Werror
  # (WARNERR in share/mk/warnings.mk) and the kernel Makefiles carry
  # -Wall -Werror. A kernel link that fails stops the build, and any
  # warning line in the log fails the job.
  stm32:
    name: stm32 kernels and userland
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the apt cache week
        id: apt-week-stm32
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives/*.deb
          key: apt-stm32-${{ steps.apt-week-stm32.outputs.week }}-${{ hashFiles('.github/workflows/firmware.yml') }}
          restore-keys: |
            apt-stm32-
      - name: Install the host toolchain
        timeout-minutes: 20
        run: |
          CI_APT_ARCHIVES="$HOME/apt-archives" sh tools/ci_apt_install.sh \
            bmake make build-essential \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            byacc bison flex libbsd-dev libfuse-dev pkg-config mandoc vim \
            python3
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Report the toolchain
        run: |
          cc --version | head -1
          arm-none-eabi-gcc --version | head -1
      - name: Build the STM32 kernels and the userland
        timeout-minutes: 25
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label linux-stm32-build \
            --log .build-logs/linux-stm32-build.log \
            --status .build-logs/linux-stm32-build.status.json \
            --idle-timeout-seconds 600 --timeout-seconds 1200 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=stm32 build
      - name: Assert the build is warning-free
        run: |
          total=$(grep -c 'warning:' .build-logs/linux-stm32-build.log || true)
          echo "warning: lines in the build log: $total"
          grep 'warning:' .build-logs/linux-stm32-build.log || true
          test "$total" -eq 0
      - name: Confirm every kernel linked
        run: |
          for kernel in sys/arch/stm32/compile/*/; do
            test -s "${kernel}unix.bin" || { echo "no unix.bin in $kernel" >&2; exit 1; }
          done
          ls -l sys/arch/stm32/compile/*/unix.bin
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  # Every required ILP32 variant belongs to this provisioned job. Executable
  # receipts distinguish assertion results from optional local skips.
  posix-sh:
    name: Required ILP32 execution (shell, kernel, libc and utilities)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the apt cache week
        id: apt-week-ilp32
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives/*.deb
          key: apt-ilp32-${{ steps.apt-week-ilp32.outputs.week }}-${{ hashFiles('.github/workflows/firmware.yml') }}
          restore-keys: |
            apt-ilp32-
      - name: Install bmake and the 32-bit compiler support
        timeout-minutes: 20
        run: |
          CI_APT_ARCHIVES="$HOME/apt-archives" sh tools/ci_apt_install.sh \
            bmake build-essential gcc-multilib python3 pkg-config libbsd-dev \
            bison flex
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Calibrate execution accounting
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label posix-inventory \
            --log .build-logs/posix-inventory.log \
            --status .build-logs/posix-inventory.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-test-execution
      # With the C17 library families the inventory runs about twenty-one
      # minutes on a hosted runner: one run finished inside 1320 s and the
      # next was stopped there with libbn and libcalc still to run. The gate
      # deadline leaves half of that again, and the step limit stays above
      # the gate deadline so the gate writes its own terminal status.
      - name: Execute every required variant
        timeout-minutes: 34
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label posix-ilp32 \
            --log .build-logs/posix-ilp32.log \
            --status .build-logs/posix-ilp32.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 1920 \
            -- bmake MACHINE=rp2040 check-ilp32-execution \
              TEST_EXECUTION_REPORT="$RUNNER_TEMP/ilp32-execution.json"
      # dc and bc need the 32-bit C library headers the gates job lacks,
      # so their ILP32 cases run here, where a missing runtime fails.
      - name: Execute dc and bc at ILP32
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label posix-dcbc-ilp32 \
            --log .build-logs/posix-dcbc-ilp32.log \
            --status .build-logs/posix-dcbc-ilp32.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 840 \
            -- bmake -C tests/dcbc check-ilp32 check-peak check-mutants REQUIRE_ILP32=1
      - name: Retain ILP32 gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilp32-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Retain per-variant invocations and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilp32-execution
          path: ${{ runner.temp }}/ilp32-execution.json
          if-no-files-found: error

  # The same tree on macOS, with Homebrew's host tools and a checksum-pinned
  # Arm GNU package. The arm-none-eabi-gcc formula is built with an absolute
  # --with-as and ignores the -B that substitutes the port's a.out assembler;
  # the rolling gcc-arm-embedded cask follows a mutable vendor package URL.
  # No FUSE: fsutil builds without its --mount command. The gate is the same
  # warning-free kernel, world and flash image.
  rp2040-macos:
    name: rp2040 kernel, flash image on macOS
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # The explicit step limits add up to 199 minutes (the host tier alone 104);
    # the bound leaves 6 minutes above that sum. The complete run of dispatch
    # 44877305151 took 65 minutes.
    timeout-minutes: 205
    steps:
      - uses: actions/checkout@v4
        with:
          # check-host includes the relocation verifier and needs the pinned
          # pre-migration source revision on macOS too.
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          brew install bmake byacc bison flex groff mandoc pkgconf picotool cflow cscope jq \
            shellcheck ruff coreutils cpio ripgrep
          case "$(uname -m)" in
            arm64)
              arm_toolchain_version=15.3.rel1
              arm_toolchain_arch=arm64
              arm_toolchain_sha256=5fb58dc3bd6684e70a02bd1c654a6b91f044cda241eb3ae663a7b9170491d7b2
              ;;
            x86_64)
              arm_toolchain_version=14.2.rel1
              arm_toolchain_arch=x86_64
              arm_toolchain_sha256=5d2e9ee4e73350bda79accc69fcd5ee59ccb902804a3f81a01d4c543b1ad7de7
              ;;
            *)
              echo "unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          arm_toolchain_package="$RUNNER_TEMP/arm-gnu-toolchain.pkg"
          arm_toolchain_url="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/$arm_toolchain_version/arm-gnu-toolchain-$arm_toolchain_version-darwin-$arm_toolchain_arch-arm-none-eabi.pkg"
          curl --fail --location --retry 3 --output "$arm_toolchain_package" \
            "$arm_toolchain_url"
          printf '%s  %s\n' "$arm_toolchain_sha256" "$arm_toolchain_package" \
            | shasum -a 256 --check
          sudo installer -pkg "$arm_toolchain_package" -target /
          echo "/Applications/ArmGNUToolchain/$arm_toolchain_version/arm-none-eabi/bin" \
            >> "$GITHUB_PATH"
          # The divider verifier reads the kernels through capstone and
          # pyelftools, and check-matezinho-host converts the artwork through
          # Pillow; Homebrew's Python refuses pip installs into itself, so
          # they live in a venv the tiers name as PYTHON.
          python3 -m venv "$HOME/gates-venv"
          "$HOME/gates-venv/bin/pip" install --quiet capstone pyelftools pillow
          echo "PYTHON=$HOME/gates-venv/bin/python3" >> "$GITHUB_ENV"
      - name: Report the toolchain
        run: |
          cc --version | head -1
          arm-none-eabi-gcc --version | head -1
          bmake -V MAKE_VERSION
          picotool version
      # tools/online-cpus.sh resolves getconf, BSD sysctl and GNU nproc in
      # that order, then returns one when a host exposes none of them; on
      # Linux it bounds the count by affinity and the cgroup CPU quota.
      # Measured on a 12-thread host: the kernel alone
      # 8.07 s to 1.55 s, the whole world 136.94 s to 31.10 s. Two -j runs
      # of the world differ from each other in 9 of 3736 artifacts, all of
      # them timestamps -- seven .a archives, whose member mtimes the
      # tree's ar records and cannot suppress, and pdc, which prints
      # __DATE__ and __TIME__; the 1286 library objects those archives
      # wrap are identical, as is every kernel object.
      - name: Build the kernel and the userland
        timeout-minutes: 35
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-build \
            --log .build-logs/macos-build.log \
            --status .build-logs/macos-build.status.json \
            --idle-timeout-seconds 600 --timeout-seconds 1800 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 build
      - name: Check the kernel flash headroom, dump-writer linkage and buffer alignment
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-kernel-headroom \
            --log .build-logs/macos-kernel-headroom.log \
            --status .build-logs/macos-kernel-headroom.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-kernel-headroom \
            check-dump-writer-link check-kernel-buffer-alignment
      - name: Build the flash image
        timeout-minutes: 15
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-flash \
            --log .build-logs/macos-flash.log \
            --status .build-logs/macos-flash.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 flash
      - name: Assert the build is warning-free
        run: |
          total=$(grep -h -c 'warning:' .build-logs/macos-build.log \
            .build-logs/macos-flash.log | awk '{ sum += $1 } END { print sum + 0 }')
          echo "warning: lines in the build log: $total"
          grep -h 'warning:' .build-logs/macos-build.log \
            .build-logs/macos-flash.log || true
          test "$total" -eq 0
      - name: Validate the kernel and root UF2 images
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-uf2 \
            --log .build-logs/macos-uf2.log \
            --status .build-logs/macos-uf2.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-uf2-images
      # coreutils gives the textbox suite its GNU references and cpio the
      # GNU cpio the cpio suite drives; macOS ships uuencode itself.
      # The tiers macOS can run. Left out: check-posix-sh (a 32-bit
      # Linux binary) and check-qemu (Homebrew's qemu has no user-mode
      # emulation).
      # The Smaller C suite runs link-only here and says so.
      - name: Run the lint tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-lint \
            --log .build-logs/macos-lint.log \
            --status .build-logs/macos-lint.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake MACHINE=rp2040 check-lint
      # The host tier owns PTY completion, terminal nohup, libc quick-exit and ndbm constructor witnesses.
      # It runs as two steps over one partition of check-host
      # (HOST_TIER_B_GATES in the Makefile; check-host-split proves it exact).
      # The first part finished every gate in 2243 s and the second in 697 s
      # (dispatch 44877305151). The nightly 44888989971 was still in the last
      # gate of the first part at 2935 s, when the idle limit ended it, so the
      # first part's runs span 2243 s (113 and 46 i86 mutants) to more than 2935 s
      # (143 and 47, as in the 2594 s run); its limit is 4500 s, and the second
      # part's limit is 1.72 times its measurement.
      # The first part carries the C17 library families, whose math and wide
      # fixtures run native and sanitized, and the ulisp mutants.
      # The second part runs after a failed first part, so one run lists the
      # failing gates of both; a cancelled run or a failed earlier step still
      # skips it.
      - name: Run the host tier, first part
        id: macos_host_a
        timeout-minutes: 80
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-host-a \
            --log .build-logs/macos-host-a.log \
            --status .build-logs/macos-host-a.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 4500 \
            -- bmake -k -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-host-a
      - name: Run the host tier, second part
        if: ${{ !cancelled() && (success() || steps.macos_host_a.conclusion == 'failure') }}
        timeout-minutes: 24
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-host-b \
            --log .build-logs/macos-host-b.log \
            --status .build-logs/macos-host-b.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 1200 \
            -- bmake -k -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-host-b
      - name: Run the cross tier
        timeout-minutes: 20
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-cross \
            --log .build-logs/macos-cross.log \
            --status .build-logs/macos-cross.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 900 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-cross
      - name: Run the board-build tier
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-board-build \
            --log .build-logs/macos-board-build.log \
            --status .build-logs/macos-board-build.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake -j"$(sh tools/online-cpus.sh)" MACHINE=rp2040 check-board-build
      - name: Link the Smaller C suite
        timeout-minutes: 5
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label macos-smaller-c \
            --log .build-logs/macos-smaller-c.log \
            --status .build-logs/macos-smaller-c.status.json \
            --idle-timeout-seconds 120 --timeout-seconds 240 \
            -- bmake -C usr.bin/smlrc test
      - name: Confirm the images exist
        run: |
          ls -l sys/arch/rp2040/compile/PICO/unix.uf2 \
                sys/arch/rp2040/compile/PICO_DIAG/unix.uf2 \
                sys/arch/rp2040/compile/PICOCALC/unix.uf2 \
                sys/arch/rp2040/compile/PICOCALC_LEAN/unix.uf2 \
                sys/arch/rp2040/compile/PICOCALC_LEAN_DIAG/unix.uf2 \
                distrib/rp2040/flash.uf2
      - name: Retain build and gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-macos-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  # The flash-id probe in tools/flash-id is the one artifact here built
  # against the Pico SDK rather than the tree's own bmake, and it ships in
  # no image, so this job is the only place the SDK route is exercised. It
  # fetches the SDK at the commit tools/pico-sdk/fetch-pico-sdk.sh pins and
  # asserts the probe still links and still fits SRAM. Everything it needs
  # is in this repository, so the job needs no second checkout and no
  # secret, and it runs on a pull request from a fork.
  flash-id:
    name: flash-id against the Pico SDK
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # The kernel builds -nostdinc against the tree's own libc, so the
      # rp2040 job needs no target C library. This one does: the SDK links
      # newlib and the target libstdc++, which the flash_id.elf map shows
      # as libc.a, libg.a, libm.a and libstdc++.a under thumb/v6-m/nofp.
      # Debian and Ubuntu ship those apart from the compiler and
      # gcc-arm-none-eabi does not depend on them, so naming the compiler
      # alone leaves the link without a C library.
      - name: Select the apt cache week
        id: apt-week-flash-id
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives/*.deb
          key: apt-flash-id-${{ steps.apt-week-flash-id.outputs.week }}-${{ hashFiles('.github/workflows/firmware.yml') }}
          restore-keys: |
            apt-flash-id-
      - name: Install the host toolchain
        timeout-minutes: 20
        run: |
          CI_APT_ARCHIVES="$HOME/apt-archives" sh tools/ci_apt_install.sh \
            bmake cmake ninja-build git \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3
          echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Fetch the Pico SDK at the pinned commit
        run: sh tools/pico-sdk/fetch-pico-sdk.sh
      - name: Report the toolchain
        run: |
          cmake --version | head -1
          ninja --version
          arm-none-eabi-gcc --version | head -1
          sh tools/pico-sdk/sdk-path.sh
      - name: Build flash-id and check it fits SRAM
        timeout-minutes: 12
        run: |
          "$PYTHON" tools/run_logged_gate.py \
            --label sdk-flash-id \
            --log .build-logs/sdk-flash-id.log \
            --status .build-logs/sdk-flash-id.status.json \
            --idle-timeout-seconds 300 --timeout-seconds 600 \
            -- bmake MACHINE=rp2040 check-flash-id
      - name: Retain flash-id build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-id-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  # The graph-layout research tier is host-only and imports NumPy, SciPy,
  # Unicorn, pyelftools and a pip-installed Zig, none of which the rp2040
  # job installs, so the same commands stay an on-demand Makefile target
  # (check-graph-layout, check-layout-extensions) and these two jobs install
  # the pinned requirements for the nightly. Neither job builds a kernel or
  # touches a board.
  graph-layout-model:
    name: Graph layout model and linker controls
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the interpreter
        run: echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Install research dependencies
        timeout-minutes: 5
        run: |
          "$PYTHON" -m pip install -r tools/graph-layout-example/requirements.txt ruff==0.17.4
      - name: Check research sources
        timeout-minutes: 2
        run: |
          ruff check tools/graph_layout*.py tools/performance_lab*.py
          ruff format --check tools/graph_layout*.py tools/performance_lab*.py
      - name: Exercise mathematical and linker controls
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONWARNINGS: error
        run: |
          "$PYTHON" tools/graph_layout_test.py
          "$PYTHON" tools/graph_layout_trace_test.py
          "$PYTHON" tools/performance_lab_test.py

  graph-layout-arm:
    name: Graph layout compiled ARM traces under Unicorn
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the interpreter
        run: echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Install extended research dependencies
        timeout-minutes: 5
        run: |
          "$PYTHON" -m pip install -r tools/graph-layout-example/requirements-extended.txt ruff==0.17.4
      - name: Lint the layout extensions
        timeout-minutes: 2
        run: ruff check tools/layout_*.py tools/arm_trace_experiment.py
      - name: Exercise the MILP, noisy-circuit and tensor controls
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$PYTHON" tools/layout_solver_extensions_test.py
      - name: Compile the HSX decoder and trace it under Unicorn
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$PYTHON" tools/arm_trace_experiment.py --output "${RUNNER_TEMP}/arm-trace"
      - name: Retain the emulated ARM traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulated-arm-traces
          path: ${{ runner.temp }}/arm-trace/
          if-no-files-found: warn

  # The hybrid-signature release verifier and the Lean policy proofs are
  # host-only: no kernel, board or serial port is involved. The ML-DSA-65
  # signing path needs OpenSSL 3.5 or newer. The ubuntu-24.04 runner image
  # ships OpenSSL 3.0.x, which has no ML-DSA, so the hybrid-signatures job
  # installs openssl 3.5.7 from conda-forge and the tests refuse to skip
  # (GIZMOBSD_REQUIRE_PQ_TESTS) when the provider is absent.
  pq-release-proofs:
    name: Release policy proofs (Lean 4.19.0)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: tools/proofs
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Calibrate proof and geometry checks
        timeout-minutes: 5
        working-directory: tools/proofs
        run: lake env python3 check_policy.py

  pq-release-hybrid:
    name: Hybrid release signatures (Ed25519 and ML-DSA-65)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Ubuntu 24.04's OpenSSL 3.0 has no ML-DSA; Ubuntu 26.04 ships OpenSSL
    # 3.5, whose default provider offers ML-DSA-44/65/87, so the job runs
    # in that distribution's container instead of a third-party channel.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -e {0}
        working-directory: distrib/rp2040/host
    steps:
      - name: Install OpenSSL with ML-DSA-65 and the test tools
        timeout-minutes: 5
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git openssl python3 python3-pytest python3-serial
          openssl list -signature-algorithms | grep -F ML-DSA-65
      - uses: actions/checkout@v4
      - name: Run the host package tests with the ML-DSA tests required
        timeout-minutes: 8
        run: python3 -m pytest -q
        env:
          GIZMOBSD_REQUIRE_PQ_TESTS: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

  # A scheduled run reports to nobody, so its result goes to one issue:
  # tools/report-nightly-failure.sh opens it, or adds a comment to the open
  # one, with the failed jobs and steps and the merges since the last
  # scheduled run that passed, and closes it when a later nightly passes.
  nightly-report:
    name: Report the nightly result
    if: always() && github.event_name == 'schedule'
    needs: [rp2040, stm32, posix-sh, rp2040-macos, flash-id, graph-layout-model, graph-layout-arm, pq-release-proofs, pq-release-hybrid]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the nightly failure issue
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/report-nightly-failure.sh
