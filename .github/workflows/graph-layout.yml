name: Graph layout research
on:
  pull_request:
    paths:
      - 'tools/graph_layout*.py'
      - 'tools/performance_lab*.py'
      - 'tools/layout_*.py'
      - 'tools/arm_trace_experiment.py'
      - 'tools/graph-layout-example/**'
      - '.github/workflows/graph-layout.yml'
  push:
    paths:
      - 'tools/graph_layout*.py'
      - 'tools/performance_lab*.py'
      - 'tools/layout_*.py'
      - 'tools/arm_trace_experiment.py'
      - 'tools/graph-layout-example/**'
      - '.github/workflows/graph-layout.yml'
permissions:
  contents: read
jobs:
  arm-and-tensor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/graph-layout-example/requirements-extended.txt ruff==0.17.4
      - run: ruff check tools/layout_*.py tools/arm_trace_experiment.py
      - run: python tools/layout_solver_extensions_test.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python tools/arm_trace_experiment.py --output "${RUNNER_TEMP}/arm-trace"
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: emulated-arm-traces
          path: ${{ runner.temp }}/arm-trace/
  host-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r tools/graph-layout-example/requirements.txt ruff==0.17.4
      - name: Check research sources
        run: |
          ruff check tools/graph_layout*.py tools/performance_lab*.py
          ruff format --check tools/graph_layout*.py tools/performance_lab*.py
      - name: Exercise mathematical and linker controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONWARNINGS: error
        run: |
          python tools/graph_layout_test.py
          python tools/graph_layout_trace_test.py
          python tools/performance_lab_test.py
