# gizmobsd-host: test the Python package on the three host platforms, build
# every native artifact, and install each one and run the installed
# commands; host-release.yml attaches the set to a release on a host-v* tag.
name: host

# A host-v* tag runs host-release.yml, which calls this workflow and then
# attaches the artifacts to the release; a paths filter and a tag filter
# in one push block would otherwise suppress the tag run.
on:
  push:
    branches:
      - main
    paths:
      - 'distrib/rp2040/host/**'
      - '.github/workflows/host.yml'
  pull_request:
    paths:
      - 'distrib/rp2040/host/**'
      - '.github/workflows/host.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: distrib/rp2040/host

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the package and its test extra
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Lint
        timeout-minutes: 5
        run: ruff check .
      - name: Test on POSIX hosts
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.build-logs"
          python -m pytest -q \
            --junitxml "$GITHUB_WORKSPACE/.build-logs/host-test.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/.build-logs/host-test.log"
      - name: Test on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.build-logs" | Out-Null
          python -m pytest -q `
            --junitxml "$env:GITHUB_WORKSPACE\.build-logs\host-test.xml" *>&1 `
            | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.build-logs\host-test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-test-${{ matrix.os }}
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  wheel:
    name: wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the distributions
        timeout-minutes: 10
        shell: bash
        run: |
          python -m pip install --upgrade pip build pipx
          mkdir -p "$GITHUB_WORKSPACE/.build-logs"
          python -m build 2>&1 | tee "$GITHUB_WORKSPACE/.build-logs/host-wheel.log"
      - name: Install the wheel and run every command
        timeout-minutes: 5
        run: |
          wheel=$(ls dist/*.whl)
          python -m pipx install "$wheel"
          export PATH="$HOME/.local/bin:$PATH"
          gizmobsd-term --version
          gizmobsd-web --version
          gizmobsd-link --version
          gizmobsd-console --version
          gizmobsd-release --help >/dev/null
          # The former names forward with one line on stderr.
          discobsd-term --version 2>&1 | grep -F 'discobsd-term is renamed gizmobsd-term'
      - name: Check that the wheel and sdist carry the release-security guide
        timeout-minutes: 2
        run: |
          python - dist/*.whl dist/*.tar.gz <<'EOF'
          import sys, tarfile, zipfile
          whl, sdist = sys.argv[1:3]
          guide = "RELEASE-SECURITY.md"
          if not any(n.endswith("/" + guide) for n in zipfile.ZipFile(whl).namelist()):
              sys.exit("wheel lacks " + guide)
          if not any(n.endswith("/" + guide) for n in tarfile.open(sdist).getnames()):
              sys.exit("sdist lacks " + guide)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-wheel
          path: |
            distrib/rp2040/host/dist/*.whl
            distrib/rp2040/host/dist/*.tar.gz
          if-no-files-found: error
      - name: Retain wheel build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-wheel-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  deb:
    name: deb (ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python devscripts \
            pybuild-plugin-pyproject python3-all python3-pytest \
            python3-serial python3-setuptools
      - name: Build the package
        timeout-minutes: 10
        shell: bash
        run: |
          cp -a packaging/debian debian
          mkdir -p "$GITHUB_WORKSPACE/.build-logs"
          dpkg-buildpackage -us -uc -b 2>&1 \
            | tee "$GITHUB_WORKSPACE/.build-logs/host-deb.log"
          rm -rf debian
      - name: Install it and run the smoke checks
        timeout-minutes: 10
        run: |
          deb=$(ls ../gizmobsd-host_*.deb)
          sudo apt-get install -y "$(readlink -f "$deb")"
          gizmobsd-term --version
          gizmobsd-console --version
          gizmobsd-release --help >/dev/null
          test -f /usr/lib/udev/rules.d/71-gizmobsd-rp2040.rules
          getent group gizmobsd
          getent group discobsd
          test -f /usr/lib/systemd/user/gizmobsd-web.service
          test -f /usr/lib/systemd/user/gizmobsd-link.service
          test -x /usr/bin/gizmobsd-connect
          test -x /usr/bin/gizmobsd-flash
          test -x /usr/bin/discobsd-connect
          test -x /usr/bin/discobsd-flash
          discobsd-term --version 2>&1 | grep -F 'discobsd-term is renamed gizmobsd-term'
          # The runner may exclude /usr/share/doc at install time
          # (path-exclude), so the guide is checked in the package itself.
          dpkg-deb -c "$deb" | grep -E ' \./usr/share/doc/gizmobsd-host/RELEASE-SECURITY\.md$'
      - name: Stage the artifact
        timeout-minutes: 5
        run: |
          mkdir -p deb-out
          cp ../gizmobsd-host_*.deb deb-out/
      - uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-deb
          path: distrib/rp2040/host/deb-out/*.deb
          if-no-files-found: error
      - name: Retain Debian build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-deb-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  arch:
    name: pkg.tar.zst (arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Install the build dependencies
        timeout-minutes: 15
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git sudo python python-build \
            python-installer python-wheel python-setuptools python-pyserial \
            python-pytest
        working-directory: /
      - uses: actions/checkout@v4
      - name: Build the package as an unprivileged user
        timeout-minutes: 10
        shell: bash
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.build-logs"
          su - builder -c "cd '$PWD/packaging/arch' && makepkg -sf --noconfirm" \
            2>&1 | tee "$GITHUB_WORKSPACE/.build-logs/host-arch.log"
      - name: Install it and run the smoke checks
        timeout-minutes: 10
        run: |
          pacman -U --noconfirm packaging/arch/gizmobsd-host-*.pkg.tar.zst
          gizmobsd-term --version
          gizmobsd-console --version
          gizmobsd-release --help >/dev/null
          test -f /usr/lib/udev/rules.d/71-gizmobsd-rp2040.rules
          getent group gizmobsd
          getent group discobsd
          test -f /usr/lib/systemd/user/gizmobsd-web.service
          test -f /usr/lib/systemd/user/gizmobsd-link.service
          test -x /usr/bin/gizmobsd-connect
          test -x /usr/bin/gizmobsd-flash
          test -x /usr/bin/discobsd-connect
          test -x /usr/bin/discobsd-flash
          discobsd-term --version 2>&1 | grep -F 'discobsd-term is renamed gizmobsd-term'
          # The archlinux image sets NoExtract for usr/share/doc/*, so the
          # guide is checked in the package file list, not the filesystem.
          pacman -Qlp packaging/arch/gizmobsd-host-*.pkg.tar.zst \
            | grep -Fx 'gizmobsd-host /usr/share/doc/gizmobsd-host/RELEASE-SECURITY.md'
      - uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-arch
          path: distrib/rp2040/host/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
      - name: Retain Arch build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-arch-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  windows:
    name: windows executables
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the package and PyInstaller
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Freeze the four commands
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.build-logs" | Out-Null
          pyinstaller --clean --noconfirm packaging/pyinstaller/gizmobsd-host.spec *>&1 `
            | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.build-logs/host-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run each executable
        timeout-minutes: 5
        shell: pwsh
        working-directory: distrib/rp2040/host/dist
        run: |
          .\gizmobsd-term.exe --version
          .\gizmobsd-web.exe --version
          .\gizmobsd-link.exe --version
          .\gizmobsd-console.exe --version
          .\discobsd-term.exe --version
          # No board is attached to a runner, so --list finds nothing and
          # exits 1. Any other status is a failure, and the step ends on a
          # clean status of its own: pwsh hands the last $LASTEXITCODE to
          # the runner, which would fail the step on the tolerated 1.
          .\gizmobsd-term.exe --list
          if ($LASTEXITCODE -ne 1 -and $LASTEXITCODE -ne 0) { exit 1 }
          exit 0
      - name: Add the flash script and run its usage check
        timeout-minutes: 5
        shell: pwsh
        run: |
          Copy-Item gizmobsd-flash.ps1, discobsd-flash.ps1 dist\
          # No arguments is a usage error, exit 1; anything else is a bug.
          & .\dist\gizmobsd-flash.ps1
          if ($LASTEXITCODE -ne 1) { exit 1 }
          exit 0
      - name: Zip the bundle
        timeout-minutes: 5
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath gizmobsd-host-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-windows
          path: distrib/rp2040/host/gizmobsd-host-windows.zip
          if-no-files-found: error
      - name: Retain Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-windows-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn

  macos:
    name: macos executables
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the package and PyInstaller
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Freeze the four commands
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.build-logs"
          pyinstaller --clean --noconfirm packaging/pyinstaller/gizmobsd-host.spec \
            2>&1 | tee "$GITHUB_WORKSPACE/.build-logs/host-macos.log"
      - name: Run each executable
        timeout-minutes: 5
        run: |
          cd dist
          ./gizmobsd-term --version
          ./gizmobsd-web --version
          ./gizmobsd-link --version
          ./gizmobsd-console --version
          ./discobsd-term --version
          # No board is attached to a runner, so --list finds nothing and
          # exits 1. Any other status is a failure.
          set +e
          ./gizmobsd-term --list
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
      - name: Add the shell scripts and run the flash script's usage check
        timeout-minutes: 5
        run: |
          cp gizmobsd-connect gizmobsd-flash discobsd-connect discobsd-flash dist/
          # No arguments is a usage error, exit 1; anything else is a bug.
          set +e
          ./dist/gizmobsd-flash
          status=$?
          set -e
          test "$status" -eq 1
      - name: Zip the bundle
        timeout-minutes: 5
        run: |
          cd dist
          zip -r ../gizmobsd-host-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-macos
          path: distrib/rp2040/host/gizmobsd-host-macos.zip
          if-no-files-found: error
      - name: Retain macOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gizmobsd-host-macos-build-logs
          path: .build-logs/
          include-hidden-files: true
          if-no-files-found: warn
