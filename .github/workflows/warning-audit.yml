name: warning policy repair validation

on:
  push:
    branches: [fix/warning-policy-audit]
    paths: ['.github/workflows/warning-audit.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply the exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/warning-policy-audit
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          import os
          baseline = '4197a91f662bf81f19de1409efd8a331b6dca16e'
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines()
          allowed = {'.github/workflows/warning-audit.yml', '.warning-policy-patch.0'}
          allowed.update(f'.warning-policy-part{i}.patch' for i in range(1, 7))
          if set(changed) - allowed:
              raise SystemExit(f'Unexpected source edits: {set(changed) - allowed}')
          digests = [
              'f156d2e81c345a8d8bed87a5a733dd989463b0bc45c9bb1aa93eaeea53a71b38',
              '916af567d105a8f3ac7d434260088846c8f780752d31d0884169b6070111182d',
              '3306403ea4f06d093a9cd4562ee24007499404cfa3414129350d0041d5ab7fca',
              '3751aa0a7bde877f76c217247a7138aafb2203160a9d2b1c3d36aad21e102426',
              'b3dbe7a46b16a3146c7c619aa6c375a264097c462947446c5ac9218480332c19',
              '16c9dfff81bb7bb2ba2bf9ff2e30a2435e1ab1f418ffd0f16aaf2b981f47de71',
          ]
          combined = b''
          for i, expected in enumerate(digests, 1):
              data = Path(f'.warning-policy-part{i}.patch').read_bytes()
              if i == 2:
                  # Restore one transport-only function-context label. No hunk
                  # content changes; the canonical digest below is authoritative.
                  old = b'@@ -91 +93 @@ CC!=\tif [ x"${MACHINE_ARCH}" = x"mips" ] ; then'
                  new = b'@@ -91 +93 @@ CC!=\tif [ x"${MACHINE_ARCH}" = x"arm" ] ; then'
                  data = data.replace(old, new)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Part {i} checksum mismatch: {actual}')
              combined += data
          if hashlib.sha256(combined).hexdigest() != '15fb1493888b2d79e7d6740f871476b5a1780cb9a99968e6e928cfc0779a1bca':
              raise SystemExit('Combined patch checksum mismatch')
          patch = Path(os.environ['RUNNER_TEMP']) / 'warning-policy.patch'
          patch.write_bytes(combined)
          subprocess.run(['git', 'apply', '--check', '--index', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(patch)], check=True)
          PY
          git rm -- .warning-policy-patch.0 .warning-policy-part{1,2,3,4,5,6}.patch
          git diff --cached --check
          cp .git/index "$RUNNER_TEMP/final-index"
          GIT_INDEX_FILE="$RUNNER_TEMP/final-index" git update-index --force-remove .github/workflows/warning-audit.yml
          actual=$(GIT_INDEX_FILE="$RUNNER_TEMP/final-index" git write-tree)
          test "$actual" = 65a42157c2c193d21260940a17c3c332cf178219
          printf 'Verified final source tree: %s\n' "$actual"
      - name: Install compilation and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake make build-essential git gcc-arm-none-eabi \
            binutils-arm-none-eabi byacc bison flex libbsd-dev libmd-dev \
            libfuse-dev pkg-config mandoc groff-base vim python3 python3-venv clang
          python3 -m venv "$RUNNER_TEMP/warning-venv"
          "$RUNNER_TEMP/warning-venv/bin/pip" install ruff
      - name: Build the complete source tree from a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/warning-results"
          bmake MACHINE=rp2040 build 2>&1 | tee "$RUNNER_TEMP/warning-results/build.log"
          if grep -n 'warning:' "$RUNNER_TEMP/warning-results/build.log"; then
            echo 'The build emitted a warning.' >&2
            exit 1
          fi
      - name: Run warning probes and affected source gates
        shell: bash
        run: |
          set -euo pipefail
          bmake MACHINE=rp2040 check-warning-policy-host check-warning-policy-cross \
            check-kernel check-config-makefile check-swapram-evac check-aout \
            2>&1 | tee "$RUNNER_TEMP/warning-results/gates.log"
          python3 tests/warning_policy/check.py host --make 'bmake HOST_CC=clang' \
            2>&1 | tee "$RUNNER_TEMP/warning-results/clang-probes.log"
          "$RUNNER_TEMP/warning-venv/bin/ruff" check tests/warning_policy/check.py
          for config in PICO PICO_UART; do
            path="sys/arch/rp2040/compile/$config"
            cp "$path/Makefile" "$RUNNER_TEMP/$config.Makefile"
            (cd "$path" && ../../../../../tools/bin/config Config)
            cmp "$path/Makefile" "$RUNNER_TEMP/$config.Makefile"
          done
          git diff --check
          git diff --exit-code
      - name: Publish the validated repair only to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/warning-policy-audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: enforce fatal warnings and clean RP2040 extra diagnostics' \
            -m 'Centralize fatal warning enforcement outside resettable CFLAGS, fix the RP2040 kernel diagnostics without group-wide suppressions, and add calibrated compiler-command regression gates.' \
            -m 'Assisted-by: ChatGPT'
          git push origin HEAD:refs/heads/fix/warning-policy-audit
          git rev-parse HEAD | tee "$RUNNER_TEMP/warning-results/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warning-policy-repair-validation
          path: ${{ runner.temp }}/warning-results/
          if-no-files-found: warn
          retention-days: 7
