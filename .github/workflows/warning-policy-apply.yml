name: warning policy application and validation

on:
  push:
    branches: ['fix/warning-policy-20260917']
    paths: ['.github/workflows/warning-policy-apply.yml']

permissions:
  contents: write

env:
  LC_ALL: C

jobs:
  apply-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply the exact locally tested patch
        run: |
          set -eu
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          import os
          from pathlib import Path
          parts = Path('.github/warning-policy-bootstrap')
          encoded = ''.join((parts / f'part{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = '2ef406833b24db85bd060cd0dd57db948f66fb29bb823553623f0c2322a59c6e'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('patch digest mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'warning-policy.patch').write_bytes(patch)
          print('verified patch:', expected)
          PY
          git apply --check "$RUNNER_TEMP/warning-policy.patch"
          git apply --index "$RUNNER_TEMP/warning-policy.patch"
          git diff --cached --check
          git rm -- .github/warning-policy-bootstrap/part0.b64 \
            .github/warning-policy-bootstrap/part1.b64 \
            .github/warning-policy-bootstrap/part2.b64 \
            .github/warning-policy-bootstrap/part3.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: enforce warning policy and resolve RP2040 Wextra diagnostics' \
            -m 'Preserve native bmake/a.out builds, propagate failures, and calibrate enforcement against deliberately rejected compilations.' \
            -m 'Assisted-by: GPT-6 Astra Pro'
          git push origin HEAD:refs/heads/fix/warning-policy-20260917
          git show --stat --oneline HEAD
      - name: Install native build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake make build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            byacc bison flex libbsd-dev libfuse-dev pkg-config mandoc vim \
            python3 shellcheck pipx
          pipx install ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Report compilers and make
        run: |
          cc --version | head -1
          arm-none-eabi-gcc --version | head -1
          bmake -V MAKE_VERSION
          ruff --version
      - name: Clean-checkout kernel and native userland build
        run: |
          set -o pipefail
          bmake -j"$(getconf _NPROCESSORS_ONLN)" MACHINE=rp2040 build 2>&1 | tee build.log
          if grep -n 'warning:' build.log; then
            echo 'unexpected compiler or linker warning' >&2
            exit 1
          fi
      - name: Calibrate warning enforcement and run affected host gates
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bmake -j"$(getconf _NPROCESSORS_ONLN)" MACHINE=rp2040 \
            check-warning-policy check-kernel check-aout check-config-makefile \
            2>&1 | tee warning-policy-gates.log
      - name: Lint the new regression gate
        if: ${{ !cancelled() }}
        run: ruff check tests/warning_policy/check.py
      - name: Retain source-only snapshot and evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/warning-policy-evidence"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/warning-policy-evidence/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/warning-policy-evidence/revisions.txt"
          for path in build.log warning-policy-gates.log; do
            if [ -f "$path" ]; then cp "$path" "$RUNNER_TEMP/warning-policy-evidence/"; fi
          done
          if [ -f "$RUNNER_TEMP/warning-policy.patch" ]; then
            cp "$RUNNER_TEMP/warning-policy.patch" "$RUNNER_TEMP/warning-policy-evidence/"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warning-policy-evidence
          path: ${{ runner.temp }}/warning-policy-evidence/
          if-no-files-found: error
          retention-days: 7
