[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gizmobsd-host"
version = "2.0.0"
description = "Host tools for the GizmoBSD RP2040 console: terminal, web console, short link"
readme = "README.md"
# The table form, not the PEP 639 string: setuptools 68.1, the version
# Ubuntu 24.04 ships and the one pybuild builds the .deb with, rejects
# a bare string here ("project.license must be valid exactly by one
# definition"). Current setuptools still accepts the table.
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Terminals :: Serial",
]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.4", "pyelftools>=0.29"]
# gizmobsd-sramdump decode reads the kernel ELF's DWARF; capture needs only picotool.
sramdump = ["pyelftools>=0.29"]
bundle = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/Oichkatzelesfrettschen/discobsd-2040-unofficial"

[project.scripts]
gizmobsd-term = "gizmobsd_host.term:main"
gizmobsd-web = "gizmobsd_host.web:main"
gizmobsd-link = "gizmobsd_host.link:main"
gizmobsd-console = "gizmobsd_host.console:main"
gizmobsd-release = "gizmobsd_host.release:main"
gizmobsd-sramdump = "gizmobsd_host.sramdump:main"
# The former command names forward to the commands above for one release.
discobsd-term = "gizmobsd_host.compat:term"
discobsd-web = "gizmobsd_host.compat:web"
discobsd-link = "gizmobsd_host.compat:link"
discobsd-console = "gizmobsd_host.compat:console"
discobsd-release = "gizmobsd_host.compat:release"
discobsd-sramdump = "gizmobsd_host.compat:sramdump"

[tool.setuptools.packages.find]
where = ["src"]

# The README links the release-security guide beside itself; the wheel
# installs it under share/doc so the link has a target in every format.
[tool.setuptools.data-files]
"share/doc/gizmobsd-host" = ["RELEASE-SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the checkout's package, not whichever gizmobsd-host the
# host has installed: an older system copy would otherwise shadow src/ and
# fail on behavior it predates.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# %d formatting stays where a width or a byte count is printed.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# The embedded console page carries minified HTML and JavaScript lines.
"src/gizmobsd_host/web.py" = ["E501"]
